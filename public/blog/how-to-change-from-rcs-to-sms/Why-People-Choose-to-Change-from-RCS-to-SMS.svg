<text x="64" y="112" font-family="Geist, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#7c5cd6" text-anchor="start" letter-spacing="2">WHY SWITCH</text><text x="64" y="190" font-family="'Instrument Serif', Georgia, 'Times New Roman', serif" font-size="54" font-weight="400" fill="#4c3a9e" text-anchor="start" letter-spacing="0">Why people go</text><text x="64" y="250" font-family="'Instrument Serif', Georgia, 'Times New Roman', serif" font-size="54" font-weight="400" fill="#4c3a9e" text-anchor="start" letter-spacing="0">back to SMS</text><text x="64" y="330" font-family="Geist, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="22" font-weight="400" fill="#5b6478" text-anchor="start" letter-spacing="0">Reliability and compatibility come</text><text x="64" y="360" font-family="Geist, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="22" font-weight="400" fill="#5b6478" text-anchor="start" letter-spacing="0">first.</text><rect x="64" y="470" width="156" height="46" rx="23" fill="#7c5cd6" stroke="#7c5cd6" stroke-opacity="0"/><text x="142" y="500" font-family="Geist, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="20" font-weight="600" fill="#ffffff" text-anchor="middle" letter-spacing="0">Universal</text><rect x="560" y="56" width="400" height="464" rx="26" fill="#ffffff" stroke="#d9dfe9"/><rect x="592" y="96" width="336" height="64" rx="18" fill="#f3effd"/><circle cx="626" cy="128" r="12" fill="#7c5cd6"/><text x="652" y="136" font-family="Geist, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="21" font-weight="600" fill="#4c3a9e" text-anchor="start" letter-spacing="0">Network compatibility</text><rect x="592" y="180" width="336" height="64" rx="18" fill="#e6ddfa"/><circle cx="626" cy="212" r="12" fill="#7c5cd6"/><text x="652" y="220" font-family="Geist, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="21" font-weight="600" fill="#4c3a9e" text-anchor="start" letter-spacing="0">International messaging</text><rect x="592" y="264" width="336" height="64" rx="18" fill="#f3effd"/><circle cx="626" cy="296" r="12" fill="#7c5cd6"/><text x="652" y="304" font-family="Geist, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="21" font-weight="600" fill="#4c3a9e" text-anchor="start" letter-spacing="0">Battery and data use</text><rect x="592" y="348" width="336" height="64" rx="18" fill="#e6ddfa"/><circle cx="626" cy="380" r="12" fill="#7c5cd6"/><text x="652" y="388" font-family="Geist, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="21" font-weight="600" fill="#4c3a9e" text-anchor="start" letter-spacing="0">Works on every phone</text>

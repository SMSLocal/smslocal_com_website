    <text x="68" y="182" font-family="Geist, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="22" font-weight="700"
    fill="#e0575f" text-anchor="start" letter-spacing="2" opacity="1" font-variant-numeric="lining-nums" font-feature-settings="'lnum' 1, 'onum' 0">TROUBLESHOOTING</text>
    <text x="68" y="268" font-family="'Instrument Serif', Georgia, 'Times New Roman', serif" font-size="88" font-weight="400"

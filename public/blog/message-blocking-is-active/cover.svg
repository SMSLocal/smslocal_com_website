    <circle cx="77" cy="462" r="5" fill="#e0575f"/>
          <text x="100" y="470" font-family="'Instrument Serif', Georgia, 'Times New Roman', serif" font-size="26" font-weight="400"
    fill="#5b6478" text-anchor="start" letter-spacing="0" opacity="1" font-variant-numeric="lining-nums" font-feature-settings="'lnum' 1, 'onum' 0">Texting not provisioned on the plan</text><circle cx="77" cy="496" r="5" fill="#e0575f"/>
          <text x="100" y="504" font-family="'Instrument Serif', Georgia, 'Times New Roman', serif" font-size="26" font-weight="400"

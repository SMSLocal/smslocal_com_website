<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 576" width="1024" height="576" role="img">
  <rect width="1024" height="576" fill="#eff6ff"/>
  <text x="64" y="58" font-family="Geist, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="20" font-weight="700"
    fill="#1d4ed8" text-anchor="start" letter-spacing="2" opacity="1" font-variant-numeric="lining-nums" font-feature-settings="'lnum' 1, 'onum' 0">TWO MEANINGS</text>
    <text x="60" y="128" font-family="'Instrument Serif', Georgia, 'Times New Roman', serif" font-size="40" font-weight="400"
    fill="#1e40af" text-anchor="start" letter-spacing="0" opacity="1" font-variant-numeric="lining-nums" font-feature-settings="'lnum' 1, 'onum' 0">One Text,</text>
    <text x="60" y="174" font-family="'Instrument Serif', Georgia, 'Times New Roman', serif" font-size="40" font-weight="400"
    fill="#1d4ed8" text-anchor="start" letter-spacing="0" opacity="1" font-variant-numeric="lining-nums" font-feature-settings="'lnum' 1, 'onum' 0">Two Meanings</text>
    
    <rect x="64" y="210" width="432" height="300" rx="24" fill="#ffffff"/>
    <text x="92" y="250" font-family="Geist, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="17" font-weight="700"
    fill="#1d4ed8" text-anchor="start" letter-spacing="2" opacity="1" font-variant-numeric="lining-nums" font-feature-settings="'lnum' 1, 'onum' 0">CASUAL CHECK-IN</text>
    <rect x="92" y="272" width="376" height="56" rx="18" fill="#f1f5f9"/>
    <text x="110" y="306" font-family="'Instrument Serif', Georgia, 'Times New Roman', serif" font-size="18" font-weight="400"
    fill="#101a33" text-anchor="start" letter-spacing="0" opacity="1" font-variant-numeric="lining-nums" font-feature-settings="'lnum' 1, 'onum' 0">WTW? Haven't heard from you!</text>
    <rect x="92" y="344" width="376" height="56" rx="18" fill="#1d4ed8"/>
    <text x="110" y="378" font-family="'Instrument Serif', Georgia, 'Times New Roman', serif" font-size="18" font-weight="400"
    fill="#ffffff" text-anchor="start" letter-spacing="0" opacity="1" font-variant-numeric="lining-nums" font-feature-settings="'lnum' 1, 'onum' 0">Just got back from vacation!</text>
    
    <rect x="528" y="210" width="432" height="300" rx="24" fill="#ffffff"/>
    <text x="556" y="250" font-family="Geist, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="17" font-weight="700"
    fill="#dc2626" text-anchor="start" letter-spacing="2" opacity="1" font-variant-numeric="lining-nums" font-feature-settings="'lnum' 1, 'onum' 0">SURPRISE REACTION</text>
    <rect x="556" y="272" width="376" height="56" rx="18" fill="#f1f5f9"/>
    <text x="574" y="306" font-family="'Instrument Serif', Georgia, 'Times New Roman', serif" font-size="18" font-weight="400"
    fill="#101a33" text-anchor="start" letter-spacing="0" opacity="1" font-variant-numeric="lining-nums" font-feature-settings="'lnum' 1, 'onum' 0">My dog opened the fridge himself!</text>
    <rect x="556" y="344" width="376" height="56" rx="18" fill="#dc2626"/>
    <text x="574" y="378" font-family="'Instrument Serif', Georgia, 'Times New Roman', serif" font-size="18" font-weight="400"
    fill="#ffffff" text-anchor="start" letter-spacing="0" opacity="1" font-variant-numeric="lining-nums" font-feature-settings="'lnum' 1, 'onum' 0">WTW?! That's wild!</text>
</svg>

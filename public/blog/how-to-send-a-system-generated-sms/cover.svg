    <text x="68" y="176" font-family="Geist, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="22" font-weight="700"
    fill="#0f766e" text-anchor="start" letter-spacing="2" opacity="1" font-variant-numeric="lining-nums" font-feature-settings="'lnum' 1, 'onum' 0">SMS API</text>
    <text x="68" y="268" font-family="'Instrument Serif', Georgia, 'Times New Roman', serif" font-size="84" font-weight="400"
    fill="#101a33" text-anchor="start" letter-spacing="0" opacity="1" font-variant-numeric="lining-nums" font-feature-settings="'lnum' 1, 'onum' 0">Automated</text>
    <text x="68" y="348" font-family="'Instrument Serif', Georgia, 'Times New Roman', serif" font-size="84" font-weight="400"
    fill="#0f766e" text-anchor="start" letter-spacing="0" opacity="1" font-variant-numeric="lining-nums" font-feature-settings="'lnum' 1, 'onum' 0">SMS</text>
    <rect x="68" y="382" width="480" height="1.4" fill="#d9dfe9"/>

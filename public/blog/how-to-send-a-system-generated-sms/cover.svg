    <text x="68" y="466" font-family="'Instrument Serif', Georgia, 'Times New Roman', serif" font-size="30" font-weight="400"
    fill="#5b6478" text-anchor="start" letter-spacing="0" opacity="1" font-variant-numeric="lining-nums" font-feature-settings="'lnum' 1, 'onum' 0">The text goes out on its own.</text>
    <rect x="596" y="142" width="350" height="92" rx="24"

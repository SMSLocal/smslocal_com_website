        <text x="626" y="184" font-family="'Instrument Serif', Georgia, 'Times New Roman', serif" font-size="32" font-weight="400"
    fill="#101a33" text-anchor="start" letter-spacing="0" opacity="1" font-variant-numeric="lining-nums" font-feature-settings="'lnum' 1, 'onum' 0">Event</text>
        <text x="626" y="214" font-family="Geist, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="20" font-weight="700"

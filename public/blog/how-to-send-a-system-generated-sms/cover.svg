    fill="#ffffff" text-anchor="start" letter-spacing="2" opacity="1" font-variant-numeric="lining-nums" font-feature-settings="'lnum' 1, 'onum' 0">TO THE HANDSET</text>
        
    
  <rect x="68" y="500" width="888" height="1.4" fill="#d9dfe9"/>
  <text x="290" y="540" font-family="Geist, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="23" font-weight="700"

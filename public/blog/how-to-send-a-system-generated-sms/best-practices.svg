    <text x="122" y="316" font-family="'Instrument Serif', Georgia, 'Times New Roman', serif" font-size="24" font-weight="400"
    fill="#101a33" text-anchor="start" letter-spacing="0" opacity="1" font-variant-numeric="lining-nums" font-feature-settings="'lnum' 1, 'onum' 0">Always support a working STOP reply</text>
    <circle cx="86" cy="370" r="22" fill="#d97706" opacity="0.14"/>
    
    <circle cx="86" cy="370" r="13" fill="#d97706"/>
    <path d="M80.54,370.26 L84.7,374.68 L91.72,365.84"

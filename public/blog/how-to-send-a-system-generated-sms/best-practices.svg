    fill="#101a33" text-anchor="start" letter-spacing="0" opacity="1" font-variant-numeric="lining-nums" font-feature-settings="'lnum' 1, 'onum' 0">Get explicit opt-in before sending anything</text>
    <circle cx="86" cy="308" r="22" fill="#d97706" opacity="0.14"/>
    
    <circle cx="86" cy="308" r="13" fill="#d97706"/>
    <path d="M80.54,308.26 L84.7,312.68 L91.72,303.84"

        <text x="320" y="341" font-family="Geist, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="19" font-weight="400"
    fill="#5b6478" text-anchor="start" letter-spacing="0" opacity="1" font-variant-numeric="lining-nums" font-feature-settings="'lnum' 1, 'onum' 0">Decide exactly what event should fire a text</text>

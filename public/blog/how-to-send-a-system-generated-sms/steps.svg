        <text x="112" y="545" font-family="'Instrument Serif', Georgia, 'Times New Roman', serif" font-size="21" font-weight="700"
    fill="#0f6b60" text-anchor="start" letter-spacing="0" opacity="1" font-variant-numeric="lining-nums" font-feature-settings="'lnum' 1, 'onum' 0">Confirm delivery</text>
        <text x="320" y="545" font-family="Geist, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="19" font-weight="400"
    fill="#5b6478" text-anchor="start" letter-spacing="0" opacity="1" font-variant-numeric="lining-nums" font-feature-settings="'lnum' 1, 'onum' 0">Check the delivery report and store the result</text>
        
</svg>

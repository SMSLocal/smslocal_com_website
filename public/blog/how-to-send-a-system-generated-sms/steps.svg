        <rect x="64" y="297" width="832" height="1.4" fill="#d9dfe9"/>
        <text x="64" y="341" font-family="'Instrument Serif', 'Times New Roman', Times, serif" font-size="22" font-weight="400"
    fill="#14b8a6" text-anchor="start" letter-spacing="0" opacity="1" font-variant-numeric="lining-nums" font-feature-settings="'lnum' 1, 'onum' 0">03</text>

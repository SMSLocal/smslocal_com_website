    <text x="60" y="174" font-family="'Instrument Serif', Georgia, 'Times New Roman', serif" font-size="40" font-weight="400"
    fill="#14b8a6" text-anchor="start" letter-spacing="0" opacity="1" font-variant-numeric="lining-nums" font-feature-settings="'lnum' 1, 'onum' 0">Your First Send</text>
    
        <text x="64" y="205" font-family="'Instrument Serif', 'Times New Roman', Times, serif" font-size="22" font-weight="400"

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 576" width="1024" height="576" role="img">
  <rect width="1024" height="576" fill="#eff6ff"/>
  <text x="64" y="58" font-family="Geist, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="20" font-weight="700"
    fill="#1d4ed8" text-anchor="start" letter-spacing="2" opacity="1" font-variant-numeric="lining-nums" font-feature-settings="'lnum' 1, 'onum' 0">THE REAL DIFFERENCE</text>
    <text x="60" y="128" font-family="'Instrument Serif', Georgia, 'Times New Roman', serif" font-size="40" font-weight="400"
    fill="#1e40af" text-anchor="start" letter-spacing="0" opacity="1" font-variant-numeric="lining-nums" font-feature-settings="'lnum' 1, 'onum' 0">Who Actually</text>
    <text x="60" y="174" font-family="'Instrument Serif', Georgia, 'Times New Roman', serif" font-size="40" font-weight="400"
    fill="#1d4ed8" text-anchor="start" letter-spacing="0" opacity="1" font-variant-numeric="lining-nums" font-feature-settings="'lnum' 1, 'onum' 0">Presses Send?</text>
    
    <rect x="64" y="210" width="432" height="280" rx="24" fill="#ffffff"/>
    <text x="92" y="250" font-family="Geist, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="17" font-weight="700"
    fill="#94a3b8" text-anchor="start" letter-spacing="2" opacity="1" font-variant-numeric="lining-nums" font-feature-settings="'lnum' 1, 'onum' 0">MANUAL</text>
    <text x="92" y="320" font-family="'Instrument Serif', Georgia, 'Times New Roman', serif" font-size="46" font-weight="700"
    fill="#94a3b8" text-anchor="start" letter-spacing="0" opacity="1" font-variant-numeric="lining-nums" font-feature-settings="'lnum' 1, 'onum' 0">~5 min</text>
    <text x="92" y="358" font-family="Geist, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="19" font-weight="400"
    fill="#5b6478" text-anchor="start" letter-spacing="0" opacity="1" font-variant-numeric="lining-nums" font-feature-settings="'lnum' 1, 'onum' 0">Someone opens an app and types it.</text>
    
    <rect x="528" y="210" width="432" height="280" rx="24" fill="#ffffff"/>
    <text x="556" y="250" font-family="Geist, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="17" font-weight="700"
    fill="#1d4ed8" text-anchor="start" letter-spacing="2" opacity="1" font-variant-numeric="lining-nums" font-feature-settings="'lnum' 1, 'onum' 0">SYSTEM-GENERATED</text>
    <text x="556" y="320" font-family="'Instrument Serif', Georgia, 'Times New Roman', serif" font-size="46" font-weight="700"
    fill="#1d4ed8" text-anchor="start" letter-spacing="0" opacity="1" font-variant-numeric="lining-nums" font-feature-settings="'lnum' 1, 'onum' 0">&lt;1 sec</text>
    <text x="556" y="358" font-family="Geist, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="19" font-weight="400"
    fill="#5b6478" text-anchor="start" letter-spacing="0" opacity="1" font-variant-numeric="lining-nums" font-feature-settings="'lnum' 1, 'onum' 0">Code detects the event and sends it.</text>
</svg>

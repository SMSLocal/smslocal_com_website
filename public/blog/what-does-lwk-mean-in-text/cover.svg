<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 576" width="1024" height="576" role="img">
  <defs>
  <linearGradient id="wash" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#f5fdfb"/><stop offset="100%" stop-color="#e5f6f3"/>
  </linearGradient>
  <radialGradient id="glow" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
    <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
  </radialGradient></defs>
  <rect width="1024" height="576" fill="url(#wash)"/>
  <ellipse cx="512" cy="300" rx="620" ry="420" fill="url(#glow)"/>
    
  <text x="512" y="60" font-family="'Instrument Serif', Georgia, 'Times New Roman', serif" font-size="44" font-weight="400"
    fill="#101a33" text-anchor="middle" letter-spacing="0" opacity="1" font-variant-numeric="lining-nums" font-feature-settings="'lnum' 1, 'onum' 0">Saying It, But Quietly</text>
  <rect x="206" y="86" width="220" height="1.4" fill="#d9dfe9"/>
  <rect x="598" y="86" width="220" height="1.4" fill="#d9dfe9"/>
  <rect x="505" y="80" width="14" height="14" transform="rotate(45 512 87)" fill="#0d9488"/>
    <text x="68" y="182" font-family="Geist, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="22" font-weight="700"
    fill="#0d9488" text-anchor="start" letter-spacing="2" opacity="1" font-variant-numeric="lining-nums" font-feature-settings="'lnum' 1, 'onum' 0">TEXT SLANG</text>
    <text x="68" y="328" font-family="'Instrument Serif', Georgia, 'Times New Roman', serif" font-size="164" font-weight="400"
    fill="#101a33" text-anchor="start" letter-spacing="0" opacity="1" font-variant-numeric="lining-nums" font-feature-settings="'lnum' 1, 'onum' 0">LWK</text>
    <rect x="68" y="358" width="320" height="3" fill="#0d9488"/>
    <text x="68" y="416" font-family="'Instrument Serif', Georgia, 'Times New Roman', serif" font-size="50" font-weight="400"
    fill="#0d9488" text-anchor="start" letter-spacing="0" opacity="1" font-variant-numeric="lining-nums" font-feature-settings="'lnum' 1, 'onum' 0">“Lowkey.”</text>
    <text x="68" y="462" font-family="'Instrument Serif', Georgia, 'Times New Roman', serif" font-size="28" font-weight="400"
    fill="#5b6478" text-anchor="start" letter-spacing="0" opacity="1" font-variant-numeric="lining-nums" font-feature-settings="'lnum' 1, 'onum' 0">Softens whatever follows.</text>
    <text x="566" y="216" font-family="Geist, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="21" font-weight="700"
    fill="#5b6478" text-anchor="start" letter-spacing="2" opacity="1" font-variant-numeric="lining-nums" font-feature-settings="'lnum' 1, 'onum' 0">HOW LOUD IT READS</text>
    
    <defs><linearGradient id="mtr566" x1="0" x2="1">
      <stop offset="0%" stop-color="#d9dfe9"/><stop offset="100%" stop-color="#0d9488"/>
    </linearGradient></defs>
    <rect x="566" y="268" width="380" height="14" rx="7" fill="url(#mtr566)"/>
    <circle cx="657.2" cy="275" r="17" fill="#ffffff" stroke="#0d9488" stroke-width="5"/>
    <text x="566" y="320" font-family="Geist, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="20" font-weight="700"
    fill="#5b6478" text-anchor="start" letter-spacing="2" opacity="1" font-variant-numeric="lining-nums" font-feature-settings="'lnum' 1, 'onum' 0">LOWKEY</text>
    <text x="946" y="320" font-family="Geist, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="20" font-weight="700"
    fill="#5b6478" text-anchor="end" letter-spacing="2" opacity="1" font-variant-numeric="lining-nums" font-feature-settings="'lnum' 1, 'onum' 0">HIGHKEY</text>
    <text x="657.2" y="242" font-family="Geist, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="21" font-weight="700"
    fill="#0d9488" text-anchor="middle" letter-spacing="2" opacity="1" font-variant-numeric="lining-nums" font-feature-settings="'lnum' 1, 'onum' 0">LWK</text>
    <text x="566" y="400" font-family="'Instrument Serif', Georgia, 'Times New Roman', serif" font-size="29" font-weight="400"
    fill="#101a33" text-anchor="start" letter-spacing="0" opacity="1" font-variant-numeric="lining-nums" font-feature-settings="'lnum' 1, 'onum' 0">“Lwk that was better.”</text>
    
  <rect x="68" y="508" width="888" height="1.4" fill="#d9dfe9"/>

  </radialGradient></defs>
  <rect width="1024" height="576" fill="url(#wash)"/>
  <ellipse cx="512" cy="300" rx="620" ry="420" fill="url(#glow)"/>
    
  <text x="512" y="60" font-family="'Instrument Serif', Georgia, 'Times New Roman', serif" font-size="44" font-weight="400"
    fill="#101a33" text-anchor="middle" letter-spacing="0" opacity="1" font-variant-numeric="lining-nums" font-feature-settings="'lnum' 1, 'onum' 0">A Short Word That Carries Weight</text>
  <rect x="206" y="86" width="220" height="1.4" fill="#d9dfe9"/>
  <rect x="598" y="86" width="220" height="1.4" fill="#d9dfe9"/>
  <rect x="505" y="80" width="14" height="14" transform="rotate(45 512 87)" fill="#d64584"/>
    <text x="68" y="182" font-family="Geist, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="22" font-weight="700"
    fill="#d64584" text-anchor="start" letter-spacing="2" opacity="1" font-variant-numeric="lining-nums" font-feature-settings="'lnum' 1, 'onum' 0">TEXT SLANG</text>
    <text x="68" y="322" font-family="'Instrument Serif', Georgia, 'Times New Roman', serif" font-size="168" font-weight="400"
    fill="#101a33" text-anchor="start" letter-spacing="0" opacity="1" font-variant-numeric="lining-nums" font-feature-settings="'lnum' 1, 'onum' 0">FRL</text>

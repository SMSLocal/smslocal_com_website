    <text x="68" y="460" font-family="'Instrument Serif', Georgia, 'Times New Roman', serif" font-size="28" font-weight="400"
    fill="#5b6478" text-anchor="start" letter-spacing="0" opacity="1" font-variant-numeric="lining-nums" font-feature-settings="'lnum' 1, 'onum' 0">Used to agree, and mean it.</text>

    <text x="568" y="186" font-family="Geist, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="22" font-weight="700"
    fill="#d64584" text-anchor="start" letter-spacing="2" opacity="1" font-variant-numeric="lining-nums" font-feature-settings="'lnum' 1, 'onum' 0">HOW IT READS</text>
    <rect x="568" y="204" width="388" height="1.4" fill="#d9dfe9"/>
    <rect x="568" y="242" width="24" height="3" fill="#d64584"/>
          <text x="604" y="250" font-family="Geist, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="22" font-weight="700"
    fill="#5b6478" text-anchor="start" letter-spacing="2" opacity="1" font-variant-numeric="lining-nums" font-feature-settings="'lnum' 1, 'onum' 0">AGREEING</text>
          <text x="568" y="294" font-family="'Instrument Serif', Georgia, 'Times New Roman', serif" font-size="26" font-weight="400"
    fill="#101a33" text-anchor="start" letter-spacing="0" opacity="1" font-variant-numeric="lining-nums" font-feature-settings="'lnum' 1, 'onum' 0">“FRL, that was the best.”</text><rect x="568" y="326" width="24" height="3" fill="#d64584"/>
          <text x="604" y="334" font-family="Geist, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="22" font-weight="700"
    fill="#5b6478" text-anchor="start" letter-spacing="2" opacity="1" font-variant-numeric="lining-nums" font-feature-settings="'lnum' 1, 'onum' 0">ASKING</text>
          <text x="568" y="378" font-family="'Instrument Serif', Georgia, 'Times New Roman', serif" font-size="26" font-weight="400"
    fill="#101a33" text-anchor="start" letter-spacing="0" opacity="1" font-variant-numeric="lining-nums" font-feature-settings="'lnum' 1, 'onum' 0">“FRL? You are serious?”</text><rect x="568" y="410" width="24" height="3" fill="#d64584"/>
          <text x="604" y="418" font-family="Geist, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="22" font-weight="700"

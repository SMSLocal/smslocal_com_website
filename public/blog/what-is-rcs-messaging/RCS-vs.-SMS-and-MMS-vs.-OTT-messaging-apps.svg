<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 576" width="1024" height="576" role="img" aria-label="RCS vs SMS, MMS and OTT apps">
<rect width="1024" height="576" fill="#f3effd"/>
<circle cx="984" cy="40" r="180" fill="#e6ddfa" opacity="0.6"/>
<circle cx="20" cy="556" r="140" fill="#e6ddfa" opacity="0.5"/>
<text x="64" y="112" font-family="Geist, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#7c5cd6" text-anchor="start" letter-spacing="2">COMPARISON</text><text x="64" y="190" font-family="'Instrument Serif', Georgia, 'Times New Roman', serif" font-size="54" font-weight="400" fill="#4c3a9e" text-anchor="start" letter-spacing="0">RCS vs SMS,</text><text x="64" y="250" font-family="'Instrument Serif', Georgia, 'Times New Roman', serif" font-size="54" font-weight="400" fill="#4c3a9e" text-anchor="start" letter-spacing="0">MMS and OTT</text><text x="64" y="310" font-family="'Instrument Serif', Georgia, 'Times New Roman', serif" font-size="54" font-weight="400" fill="#4c3a9e" text-anchor="start" letter-spacing="0">apps</text><text x="64" y="390" font-family="Geist, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="22" font-weight="400" fill="#5b6478" text-anchor="start" letter-spacing="0">Carrier-based like SMS, with</text><text x="64" y="420" font-family="Geist, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="22" font-weight="400" fill="#5b6478" text-anchor="start" letter-spacing="0">app-like features.</text><rect x="64" y="470" width="205" height="46" rx="23" fill="#7c5cd6" stroke="#7c5cd6" stroke-opacity="0"/><text x="166.5" y="500" font-family="Geist, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="20" font-weight="600" fill="#ffffff" text-anchor="middle" letter-spacing="0">Carrier-based</text><rect x="520" y="56" width="440" height="464" rx="26" fill="#ffffff" stroke="#d9dfe9"/><text x="552" y="112" font-family="Geist, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#5b6478" text-anchor="start" letter-spacing="0">Feature</text><text x="850" y="112" font-family="Geist, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#7c5cd6" text-anchor="start" letter-spacing="0">RCS</text><line x1="544" y1="136" x2="936" y2="136" stroke="#e5e9f1"/><text x="552" y="168" font-family="Geist, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="21" font-weight="400" fill="#101a33" text-anchor="start" letter-spacing="0">Character limit</text><text x="850" y="168" font-family="Geist, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="21" font-weight="700" fill="#7c5cd6" text-anchor="start" letter-spacing="0">Unlimited</text><line x1="544" y1="198" x2="936" y2="198" stroke="#e5e9f1"/><text x="552" y="230" font-family="Geist, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="21" font-weight="400" fill="#101a33" text-anchor="start" letter-spacing="0">Media</text><text x="850" y="230" font-family="Geist, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="21" font-weight="700" fill="#7c5cd6" text-anchor="start" letter-spacing="0">Images, video</text><line x1="544" y1="260" x2="936" y2="260" stroke="#e5e9f1"/><text x="552" y="292" font-family="Geist, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="21" font-weight="400" fill="#101a33" text-anchor="start" letter-spacing="0">Typing indicators</text><text x="850" y="292" font-family="Geist, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="21" font-weight="700" fill="#7c5cd6" text-anchor="start" letter-spacing="0">Yes</text><line x1="544" y1="322" x2="936" y2="322" stroke="#e5e9f1"/><text x="552" y="354" font-family="Geist, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="21" font-weight="400" fill="#101a33" text-anchor="start" letter-spacing="0">Read receipts</text><text x="850" y="354" font-family="Geist, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="21" font-weight="700" fill="#7c5cd6" text-anchor="start" letter-spacing="0">Yes</text><line x1="544" y1="384" x2="936" y2="384" stroke="#e5e9f1"/><text x="552" y="416" font-family="Geist, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="21" font-weight="400" fill="#101a33" text-anchor="start" letter-spacing="0">Encryption</text><text x="850" y="416" font-family="Geist, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="21" font-weight="700" fill="#b45252" text-anchor="start" letter-spacing="0">Not end-to-end</text>
</svg>
